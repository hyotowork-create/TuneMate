# TOPP PRO DM24.8 (SEIKAKU 2세대) 제어 프로토콜 명세 — 역분석 결과를 여기에 채운다.
# status 가 verified 가 아니면 앱은 이 믹서에 어떤 값도 쓰지 않는다 (기획서 6장 Go/No-go, 10장 리스크).
# 아래 값은 전부 자리 표시용 예시다. Phase 0 캡처(11장 A 체크리스트) 뒤 확정한다.
spec_version: 1
status: unverified
model: TOPP PRO DM24.8
firmware: unknown            # 확인 후 "1.2.3" 처럼 적는다. 믹서가 다른 버전을 보고하면 쓰기 차단.

transport:
  kind: tcp                  # tcp | udp — Wireshark 캡처로 확정
  port: 0                    # 확정 전 0
  keepalive_interval_ms: 0   # 30초 무조작 구간에서 관찰한 주기
  keepalive_bytes: []

handshake:
  send: []                   # 앱 실행 직후 첫 패킷
  expect_prefix: []

frame:
  header: [0xAA, 0x55]       # 예시
  length_field_size: 1
  length_includes_header: false
  address_size: 2
  value_size: 2
  byte_order: little
  checksum: none             # none | sum8 | xor8 | crc16_ccitt
  trailer: []

# 파라미터 주소 = address_base + (채널·버스 번호-1) × stride + (밴드-1) × band_stride
parameters:
  channel.fader:     { address_base: 0x0000, stride: 0x0040, encoding: fader_db,  verified: false }
  channel.mute:      { address_base: 0x0001, stride: 0x0040, encoding: bool,      verified: false }
  channel.gain:      { address_base: 0x0002, stride: 0x0040, encoding: gain_db,   verified: false }
  channel.pan:       { address_base: 0x0003, stride: 0x0040, encoding: pan,       verified: false }
  channel.phantom:   { address_base: 0x0004, stride: 0x0040, encoding: bool,      verified: false }
  channel.eq.on:     { address_base: 0x0008, stride: 0x0040, encoding: bool,      verified: false }
  channel.eq.freq:   { address_base: 0x0010, stride: 0x0040, band_stride: 0x0004, encoding: freq_log, verified: false }
  channel.eq.gain:   { address_base: 0x0011, stride: 0x0040, band_stride: 0x0004, encoding: eq_gain,  verified: false }
  channel.eq.q:      { address_base: 0x0012, stride: 0x0040, band_stride: 0x0004, encoding: q_log,    verified: false }
  channel.eq.band_on: { address_base: 0x0013, stride: 0x0040, band_stride: 0x0004, encoding: bool,    verified: false }
  channel.send:      { address_base: 0x0020, stride: 0x0040, band_stride: 0x0001, encoding: fader_db, verified: false }  # band = aux-1
  aux.fader:         { address_base: 0x0800, stride: 0x0040, encoding: fader_db,  verified: false }
  aux.mute:          { address_base: 0x0801, stride: 0x0040, encoding: bool,      verified: false }
  aux.eq.freq:       { address_base: 0x0810, stride: 0x0040, band_stride: 0x0004, encoding: freq_log, verified: false }
  aux.eq.gain:       { address_base: 0x0811, stride: 0x0040, band_stride: 0x0004, encoding: eq_gain,  verified: false }
  aux.eq.q:          { address_base: 0x0812, stride: 0x0040, band_stride: 0x0004, encoding: q_log,    verified: false }
  aux.eq.band_on:    { address_base: 0x0813, stride: 0x0040, band_stride: 0x0004, encoding: bool,     verified: false }
  main.fader:        { address_base: 0x0A00, stride: 0, encoding: fader_db, verified: false }
  main.mute:         { address_base: 0x0A01, stride: 0, encoding: bool,     verified: false }
  main.eq.freq:      { address_base: 0x0A10, stride: 0, band_stride: 0x0004, encoding: freq_log, verified: false }
  main.eq.gain:      { address_base: 0x0A11, stride: 0, band_stride: 0x0004, encoding: eq_gain,  verified: false }
  main.eq.q:         { address_base: 0x0A12, stride: 0, band_stride: 0x0004, encoding: q_log,    verified: false }
  main.eq.band_on:   { address_base: 0x0A13, stride: 0, band_stride: 0x0004, encoding: bool,     verified: false }
  scene.recall:      { address_base: 0x0F00, stride: 0, encoding: raw, verified: false }
  scene.save:        { address_base: 0x0F01, stride: 0, encoding: raw, verified: false }

encodings:
  fader_db: { kind: linear, min: -90, max: 10, min_raw: 0, max_raw: 1023 }    # 실제는 비선형(테이블)일 가능성 높음 → kind: table
  gain_db:  { kind: linear, min: -12, max: 60, min_raw: 0, max_raw: 72 }
  pan:      { kind: linear, min: -1, max: 1, min_raw: 0, max_raw: 100 }
  freq_log: { kind: log, min: 20, max: 20000, min_raw: 0, max_raw: 200 }
  eq_gain:  { kind: linear, min: -15, max: 15, min_raw: 0, max_raw: 60 }
  q_log:    { kind: log, min: 0.3, max: 10, min_raw: 0, max_raw: 71 }
  bool:     { kind: bool }
  raw:      { kind: raw }

notes:
  - "확인 필요: 메인 출력 EQ 종류(PEQ/GEQ)와 밴드 수 → main.eq.* 밴드 수와 AutoEQ maxFilters 결정"
  - "확인 필요: 출력 딜레이 유무 → 있으면 main.delay 파라미터 추가"
  - "확인 필요: 공식 iPad 앱과 동시 접속 허용 여부"
  - "Go 기준: 평문 바이너리 + 같은 조작 → 같은 패킷 + 재전송 시 같은 동작"
